[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-filesystem-mcp"
version = "0.1.0"
description = "MCP filesystem server restricted to a project-local sandbox"
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.30,<2"]

[tool.setuptools]
py-modules = ["server"]
