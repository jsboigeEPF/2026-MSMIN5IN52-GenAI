[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-opencode"
version = "0.1.0"
description = "Deterministic agentic coding process with human-in-the-loop approval (course B1)"
requires-python = ">=3.11"
dependencies = [
    "semantic-kernel==1.45.0",
    "openai==3.37.0",
    "httpx2==2.16.0",  # openai 3.x HTTP client; used directly to inject test transports
    "pydantic==2.13.5",
    "pydantic-settings==2.16.1",
    "aiosqlite==0.22.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "typer==0.27.3",
    "streamlit==1.66.1",
    "textual==8.2.8",
    "pytest==9.1.1",  # runs the target repository's tests in the verify step
    "ruff==0.17.2",  # lints the approved file in the verify step
]

[project.scripts]
omar = "src.tui.app:main"

[project.optional-dependencies]
dev = [
    "pytest-asyncio==1.4.0",
    "pyright==1.1.414",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
