# Copier vers ~/.config/pipewire/pipewire.conf.d/90-voiceagent-aec.conf
context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "voiceagent_aec_capture"
            }
            source.props = {
                node.name = "voiceagent_aec_source"
                node.description = "Micro (AEC)"
            }
            sink.props = {
                node.name = "voiceagent_aec_sink"
                node.description = "HP (AEC)"
            }
            playback.props = {
                node.name = "voiceagent_aec_playback"
            }
        }
    }
]
