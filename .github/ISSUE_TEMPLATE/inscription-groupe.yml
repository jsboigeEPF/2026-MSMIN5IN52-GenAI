name: Inscription d'un groupe

description: Réserver un sujet du catalogue pour un groupe
title: "[Groupe] "
body:
  - type: markdown
    attributes:
      value: |
        Vérifiez les issues ouvertes avant de réserver : un sujet ne peut être attribué qu'à un groupe. Ne publiez aucune donnée personnelle autre que les noms des membres nécessaires à l'inscription.
  - type: input
    id: subject
    attributes:
      label: Sujet choisi
      description: Indiquez l'identifiant et le titre exacts du catalogue, par exemple A1 — RAG hybride avec reranking et citations.
      placeholder: A1 — Titre du sujet
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: Membres du groupe
      description: Indiquez les noms des membres, un par ligne. Le format standard est trois personnes.
    validations:
      required: true
  - type: input
    id: github_owner
    attributes:
      label: Compte GitHub porteur du fork
      description: Donnez uniquement le nom du compte GitHub qui portera le fork et la PR.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation et première piste
      description: En quelques lignes, expliquez pourquoi le sujet vous intéresse et quelle baseline ou première expérience vous envisagez.
    validations:
      required: true
  - type: checkboxes
    id: commitments
    attributes:
      label: Vérifications
      options:
        - label: J'ai vérifié qu'aucune issue ouverte ne réserve déjà ce sujet.
          required: true
        - label: Le groupe accepte de travailler dans un unique dossier `groupe-<nom-court>`.
          required: true
        - label: Aucune clé, donnée confidentielle ou information personnelle inutile ne sera publiée.
          required: true
