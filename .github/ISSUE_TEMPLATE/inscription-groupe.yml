name: Inscription d'un groupe

description: Réserver un sujet du catalogue pour un groupe
title: "[Groupe] "
body:
  - type: markdown
    attributes:
      value: |
        Vérifiez les issues ouvertes avant de réserver : un sujet ne peut être attribué qu'à un groupe. Ce dépôt est public : utilisez uniquement les comptes GitHub des membres et ne publiez ni nom, ni adresse e-mail, ni numéro étudiant.
  - type: input
    id: subject
    attributes:
      label: Sujet choisi
      description: Indiquez l'identifiant et le titre exacts du catalogue, par exemple A1 — RAG hybride avec reranking et citations.
      placeholder: A1 — Titre du sujet
    validations:
      required: true
  - type: textarea
    id: members
    attributes:
      label: Membres du groupe (comptes GitHub)
      description: >-
        Indiquez le compte GitHub de chaque membre, un par ligne, sous la forme @pseudo.
        Le format standard est trois personnes. N'indiquez ni noms, ni adresses e-mail,
        ni numéros étudiants. Ce dépôt est public et indexé durablement ; le lien entre
        les comptes GitHub et les identités est tenu hors du dépôt par l'enseignant.
    validations:
      required: true
  - type: input
    id: github_owner
    attributes:
      label: Compte GitHub porteur du fork
      description: Donnez uniquement le compte GitHub, déjà cité ci-dessus, qui portera le fork et la PR.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation et première piste
      description: En quelques lignes, expliquez pourquoi le sujet vous intéresse et quelle baseline ou première expérience vous envisagez.
    validations:
      required: true
  - type: checkboxes
    id: commitments
    attributes:
      label: Vérifications
      options:
        - label: J'ai vérifié qu'aucune issue ouverte ne réserve déjà ce sujet. En cas de demandes concurrentes, l'issue dont le `createdAt` GitHub est le plus ancien prévaut.
          required: true
        - label: Le groupe accepte de travailler dans un unique dossier `groupe-<nom-court>`.
          required: true
        - label: Aucune clé, donnée confidentielle ou information personnelle inutile ne sera publiée.
          required: true
